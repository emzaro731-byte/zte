name: Build ZTE Liquid Glass Flutter Launcher

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name zte_liquid_glass_launcher .

      - name: Restore Flutter sources
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Patch launcher Android host
        run: |
          mkdir -p android/app/src/main/kotlin/com/gg/zteliquidglass
          cat > android/app/src/main/kotlin/com/gg/zteliquidglass/MainActivity.kt <<'EOF'
          package com.gg.zteliquidglass

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream

          class MainActivity : FlutterActivity() {
            private val channelName = "zte_launcher/apps"

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                .setMethodCallHandler { call, result ->
                  when (call.method) {
                    "listApps" -> result.success(listApps())
                    "launchApp" -> {
                      val pkg = call.argument<String>("package")
                      val intent = pkg?.let { packageManager.getLaunchIntentForPackage(it) }
                      if (intent != null) {
                        startActivity(intent)
                        result.success(true)
                      } else {
                        result.success(false)
                      }
                    }
                    "openAppDetails" -> {
                      try {
                        val intent = Intent(
                          android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                          android.net.Uri.parse("package:$packageName")
                        )
                        startActivity(intent)
                        result.success(true)
                      } catch (_: Exception) {
                        result.success(false)
                      }
                    }
                    else -> result.notImplemented()
                  }
                }
            }

            private fun listApps(): List<Map<String, Any>> {
              val intent = Intent(Intent.ACTION_MAIN).apply {
                addCategory(Intent.CATEGORY_LAUNCHER)
              }
              val infos = packageManager.queryIntentActivities(intent, PackageManager.MATCH_ALL)
              return infos
                .filter { it.activityInfo.packageName != packageName }
                .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                .map {
                  val icon = drawableToPng(it.loadIcon(packageManager))
                  mapOf(
                    "label" to it.loadLabel(packageManager).toString(),
                    "package" to it.activityInfo.packageName,
                    "icon" to icon
                  )
                }
            }

            private fun drawableToPng(drawable: Drawable): ByteArray {
              val size = 96
              val bitmap = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
              val canvas = Canvas(bitmap)
              drawable.setBounds(0, 0, size, size)
              drawable.draw(canvas)
              val stream = ByteArrayOutputStream()
              bitmap.compress(Bitmap.CompressFormat.PNG, 100, stream)
              return stream.toByteArray()
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
          '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>''')
          s=s.replace('<category android:name="android.intent.category.LAUNCHER"/>',
          '''<category android:name="android.intent.category.LAUNCHER"/>
                      <category android:name="android.intent.category.HOME"/>
                      <category android:name="android.intent.category.DEFAULT"/>''',1)
          p.write_text(s)
          PY

          sed -i 's/android:name="com.example.zte_liquid_glass_launcher.MainActivity"/android:name="com.gg.zteliquidglass.MainActivity"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zte-liquid-glass-launcher
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
